name: Publish PR 91906 exact current-main product v2

on:
  push:
    branches: [main]
    paths:
      - .github/pr91906-current-main-publish.trigger

permissions:
  contents: read

concurrency:
  group: pr91906-current-main-product-v2
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.head_commit.message ==
      'ci: trigger PR 91906 exact current-main product v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.ARES_REVIEW_TOKEN }}

    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node 22.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0

      - name: Use repository-authorized npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Set up exact uv 0.12.5
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Publish exact eleven-path product
        run: python3 .github/scripts/publish-hermes-dependency-security.py
